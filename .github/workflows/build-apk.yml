name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set app name to TransReader
        run: |
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:label="[^"]*"/android:label="TransReader"/g' android/app/src/main/AndroidManifest.xml
          fi

      - name: Generate TransReader app icon
        run: |
          if [ -f assets/icon.png ]; then
            flutter pub add --dev flutter_launcher_icons
            cat << 'EOF' > flutter_launcher_icons.yaml
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon.png"
            adaptive_icon_background: "#2A1B12"
            adaptive_icon_foreground: "assets/icon.png"
          EOF
            dart run flutter_launcher_icons
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransReader-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
