name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Create Android platform files
        run: flutter create . --platforms=android

      - name: Install dependencies
        run: flutter pub get

      - name: Configure AndroidManifest (Name, Internet, Impeller, DeepLink)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="[^"]*"/android:label="TransReader"/g' "$MANIFEST"
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
            fi
            if ! grep -q "EnableImpeller" "$MANIFEST"; then
              sed -i 's|</application>|    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />\n    </application>|' "$MANIFEST"
            fi
            if ! grep -q 'android:scheme="transreader"' "$MANIFEST"; then
              sed -i 's|</activity>|    <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="transreader" android:host="callback" />\n            </intent-filter>\n        </activity>|' "$MANIFEST"
            fi
          fi

      - name: Generate TransReader app icon
        run: |
          if [ -f assets/icon.png ]; then
            flutter pub add --dev flutter_launcher_icons
            cat << 'EOF' > flutter_launcher_icons.yaml
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon.png"
            adaptive_icon_background: "#2A1B12"
            adaptive_icon_foreground: "assets/icon.png"
          EOF
            dart run flutter_launcher_icons
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransReader-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
