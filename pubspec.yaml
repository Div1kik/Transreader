name: book_translator
description: TransReader - Offline & AI Book Reader and Translator
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  file_picker: ^8.3.7
  shared_preferences: ^2.5.3
  http: ^1.3.0
  xml: ^6.5.0
  connectivity_plus: ^6.1.3
  google_mlkit_translation: ^0.12.0
  url_launcher: ^6.3.1
  app_links: ^6.4.0
  crypto: ^3.0.6
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
