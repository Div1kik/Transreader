name: book_translator
description: Offline-first book reader and translator for TXT and FB2.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.4
  sqflite: ^2.4.0
  path_provider: ^2.1.5
  path: ^1.9.0
  http: ^1.2.2
  xml: ^6.5.0
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
